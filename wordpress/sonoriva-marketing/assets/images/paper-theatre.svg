<svg class="paper-theatre" viewBox="0 0 1600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="paper-theatre-title paper-theatre-description" preserveAspectRatio="xMidYMid meet">
  <title id="paper-theatre-title">Un spectacle de papier animé par SonoRiva</title>
  <desc id="paper-theatre-description">Sous des rideaux rouges et des projecteurs, quatre comédiens en papier découpé dansent devant le public. À droite, une régisseuse déclenche les sons sur son ordinateur.</desc>
