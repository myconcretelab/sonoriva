    55% { opacity: .18; }
    59% { opacity: .92; }
    64% { opacity: .35; }
    69%, 100% { opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .draw { animation: none; stroke-dashoffset: 0; }
    .fill { animation: none; opacity: 1; }
  }
</style>

