name: Publication de SonoRiva Bridge

on:
  workflow_dispatch:
  push:
    tags:
      - 'bridge-v*'

permissions:
  contents: write

concurrency:
  group: bridge-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            tauriExecutable: tauri
            appleSigningIdentity: '-'
          - name: Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            tauriExecutable: tauri
            appleSigningIdentity: '-'
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            tauriExecutable: tauri.cmd
            appleSigningIdentity: ''
    env:
      APPLE_SIGNING_IDENTITY: ${{ matrix.appleSigningIdentity }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
      - name: Préparer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - name: Préparer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Restaurer le cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: bridge/src-tauri -> target
      - name: Installer les dépendances
        run: npm ci --prefix bridge --include=dev --include=optional
      - name: Installer les dépendances de l’interface
        run: npm ci
      - name: Intégrer la régie locale
        run: npm run build:bridge-ui
      - name: Tester le bridge
        run: cargo test --manifest-path bridge/src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Compiler et publier le bridge
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: bridge/src-tauri
          tauriScript: ${{ github.workspace }}/bridge/node_modules/.bin/${{ matrix.tauriExecutable }}
          tagName: bridge-v__VERSION__
          releaseName: SonoRiva Bridge v__VERSION__
          releaseBody: |
            Trois paquets sont disponibles : macOS 11 ou version ultérieure pour Apple Silicon (aarch64), macOS 11 ou version ultérieure pour Intel (x64), et Windows x64.

            Les paquets macOS utilisent une signature ad hoc sans certificat Apple Developer ni notarisation. L’installateur Windows n’est pas signé.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: SonoRiva-Bridge_[version]_[arch].[ext]
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
