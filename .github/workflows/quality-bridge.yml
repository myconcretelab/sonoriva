name: Vérifications du Bridge

on:
  pull_request:
    paths:
      - 'bridge/**'
      - '.github/workflows/quality-bridge.yml'
      - '.github/workflows/release-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'bridge/**'
      - '.github/workflows/quality-bridge.yml'
      - '.github/workflows/release-bridge.yml'

permissions:
  contents: read

concurrency:
  group: bridge-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
          - name: Windows x64
            runner: windows-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
      - name: Préparer Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - name: Préparer Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Restaurer le cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: bridge/src-tauri -> target
      - name: Installer les dépendances du bridge
        run: npm ci --prefix bridge --include=dev --include=optional
      - name: Installer les dépendances de l’interface
        run: npm ci
      - name: Intégrer la régie locale
        run: npm run build:bridge-ui
      - name: Vérifier le format Rust
        run: npm --prefix bridge run format:check
      - name: Vérifier la compilation Rust
        run: npm --prefix bridge run check
      - name: Exécuter les tests Rust
        run: npm --prefix bridge test
